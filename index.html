<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1121"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>broskies-project-frontend</title>
  </head>
  <body class="bg-white dark:bg-primary text-primary dark:text-white">
    <div id="root"></div>
    <script
      type="module"
      src="/src/index.tsx"
    ></script>
    <script>
      const storedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia(
        '(prefers-color-scheme: dark)',
      ).matches;
      if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </body>
</html>
